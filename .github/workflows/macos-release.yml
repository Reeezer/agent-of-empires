name: Mac release

on:
  push:
    tags: ['v*-mac.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: aoe-darwin-arm64
          - os: macos-15-intel
            asset: aoe-darwin-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check and build
        run: |
          brew install tmux
          bash -n scripts/install.sh
          python3 scripts/test-macos-install.py
          cargo fmt --all --check
          cargo clippy --locked -- -D warnings
          cargo test --locked
          cargo build --locked --profile dev-release --bin aoe
          target/dev-release/aoe --version
      - name: Package
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp target/dev-release/aoe "dist/$ASSET"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp -R licenses dist/
          cd dist
          tar czf "$ASSET.tar.gz" "$ASSET" LICENSE THIRD_PARTY_NOTICES.md licenses
          shasum -a 256 "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "AoE for Mac $tag" --latest \
            --notes 'Personal Mac fork with session cost estimates, Claude context usage, and background work indicators. Supports Apple Silicon and Intel. See the README for installation.'
